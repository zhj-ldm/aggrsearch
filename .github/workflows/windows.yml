name: Windows Build & Smoke Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  BIN: aggrsearch.exe

jobs:
  build:
    name: Build (windows-latest)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "."

      - name: Unit tests
        run: cargo test --release --locked

      - name: Build release
        run: cargo build --release --locked

      - name: Package artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item "target\release\$env:BIN" "dist\$env:BIN"
          # 当前 ort 在 Windows 上静态链接；若未来输出动态库则一并打包
          Get-ChildItem "target\release\*.dll" -ErrorAction SilentlyContinue | ForEach-Object {
            Copy-Item $_.FullName "dist\$($_.Name)"
            Write-Host "bundled $($_.Name)"
          }
          Compress-Archive -Path "dist\*" -DestinationPath "dist\aggrsearch-windows-x86_64.zip" -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: aggrsearch-windows-x86_64
          path: |
            dist/aggrsearch-windows-x86_64.zip
            dist/aggrsearch.exe
            dist/*.dll
          if-no-files-found: error

  smoke-test:
    name: Smoke test (run on Windows)
    needs: build
    runs-on: windows-latest
    env:
      # 常规冒烟测试不下载模型，只验证 CLI/HTTP 与词法回退
      AGGRSEARCH_EMBED: "off"
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: aggrsearch-windows-x86_64
          path: dist

      - name: version / health CLI
        shell: pwsh
        run: |
          $exe = "dist\aggrsearch.exe"
          & $exe version
          if ($LASTEXITCODE -ne 0) { throw "version 退出码 $LASTEXITCODE" }
          & $exe health | Tee-Object -Variable healthOut
          if ($LASTEXITCODE -ne 0) { throw "health 退出码 $LASTEXITCODE" }
          $healthOut | Out-String | Write-Host
          $json = (& $exe health | Out-String) | ConvertFrom-Json
          if ($json.status -ne "ok") { throw "health 状态异常: $($json.status)" }
          if ($json.name -ne "aggrsearch") { throw "health name 异常: $($json.name)" }

      - name: HTTP server /health
        shell: pwsh
        run: |
          $exe = "dist\aggrsearch.exe"
          $p = Start-Process -FilePath $exe -ArgumentList "serve","--port","18080" -PassThru -NoNewWindow
          try {
            $ok = $false
            for ($i = 0; $i -lt 30; $i++) {
              Start-Sleep -Seconds 1
              try {
                $r = Invoke-RestMethod -Uri "http://127.0.0.1:18080/health" -TimeoutSec 3
                if ($r.status -eq "ok") { $ok = $true; break }
              } catch { }
            }
            if (-not $ok) { throw "服务 30s 内未就绪" }
            Write-Host "GET /health -> $($r | ConvertTo-Json -Compress)"
          } finally {
            if (-not $p.HasExited) { Stop-Process -Id $p.Id -Force }
          }

      - name: Online search & fetch (best effort)
        continue-on-error: true
        shell: pwsh
        run: |
          $exe = "dist\aggrsearch.exe"
          $p = Start-Process -FilePath $exe -ArgumentList "serve","--port","18081" -PassThru -NoNewWindow
          try {
            for ($i = 0; $i -lt 30; $i++) {
              Start-Sleep -Seconds 1
              try { Invoke-RestMethod -Uri "http://127.0.0.1:18081/health" -TimeoutSec 3 | Out-Null; break } catch { }
            }
            Write-Host "--- /search ---"
            $s = Invoke-RestMethod -Uri "http://127.0.0.1:18081/search?q=rust&max_results=3" -TimeoutSec 30
            $s | ConvertTo-Json -Depth 4 | Write-Host
            Write-Host "results=$($s.results.Count)"
            Write-Host "--- /fetch ---"
            $f = Invoke-RestMethod -Uri "http://127.0.0.1:18081/fetch?url=https://www.rust-lang.org/" -TimeoutSec 30
            Write-Host "status=$($f.status) body_len=$($f.body.Length)"
          } finally {
            if (-not $p.HasExited) { Stop-Process -Id $p.Id -Force }
          }

  embedding-test:
    name: Embedding rerank (run on Windows)
    needs: build
    runs-on: windows-latest
    env:
      AGGRSEARCH_EMBED_CACHE: ${{ github.workspace }}/.embed-cache
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: aggrsearch-windows-x86_64
          path: dist

      - name: Cache embedding model
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.embed-cache
          key: embeddinggemma-300m-int8-v1

      - name: Run embedding rerank over HTTP
        shell: pwsh
        run: |
          $exe = "dist\aggrsearch.exe"
          $p = Start-Process -FilePath $exe -ArgumentList "serve","--port","18083" -PassThru -NoNewWindow
          try {
            Write-Host "等待 embedding 模型加载（首次需下载约 309MB）..."
            $ready = $false
            for ($i = 0; $i -lt 180; $i++) {
              Start-Sleep -Seconds 5
              try {
                $h = Invoke-RestMethod -Uri "http://127.0.0.1:18083/health" -TimeoutSec 5
                if ($h.embedding.ready) { $ready = $true; break }
              } catch { }
              if ($p.HasExited) { throw "服务提前退出，退出码 $($p.ExitCode)" }
            }
            if (-not $ready) { throw "embedding 模型 15 分钟内未就绪" }
            Write-Host "embedding ready: $($h.embedding | ConvertTo-Json -Compress)"

            $s = Invoke-RestMethod -Uri "http://127.0.0.1:18083/search?q=rust%20async&max_results=3&engines=bing_intl" -TimeoutSec 90
            $s | ConvertTo-Json -Depth 5 | Write-Host
            if ($s._timing.stages.embedding_rerank -ne $true) { throw "本次搜索未走 embedding 重排" }
            if (-not $s.results -or $s.results.Count -eq 0) { throw "搜索无结果，无法验证重排分数" }
            foreach ($r in $s.results) {
              $score = [double]$r._rerank_score
              if ($score -lt -1.0 -or $score -gt 1.0) { throw "非法的余弦分数: $score" }
              Write-Host ("{0}  score={1:N4}" -f $r.title, $score)
            }
          } finally {
            if (-not $p.HasExited) { Stop-Process -Id $p.Id -Force }
          }
